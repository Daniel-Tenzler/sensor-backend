<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - Sensor Dashboard</title>
    <link rel="stylesheet" href="/css/error.css">
    <meta http-equiv="refresh" content="300">
</head>
<body>
    <div class="error-container maintenance">
        <div class="error-content">
            <div class="error-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            </div>
            <h1 class="error-title">System Maintenance</h1>
            <p class="error-message">{{message}}</p>
            {{#if estimatedEnd}}
            <p class="maintenance-time">Estimated completion: {{estimatedEnd}}</p>
            {{/if}}
            <div class="maintenance-info">
                <p>We're working to improve your experience. Please check back shortly.</p>
                <p>This page will automatically refresh every 5 minutes.</p>
            </div>
            <div class="maintenance-progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p id="refreshTimer">Next refresh in: <span id="countdown">300</span> seconds</p>
            </div>
        </div>
    </div>
    
    <script>
        // Countdown timer for refresh
        let countdown = 300;
        const countdownElement = document.getElementById('countdown');
        const progressFill = document.getElementById('progressFill');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            // Update progress bar
            const progress = ((300 - countdown) / 300) * 100;
            progressFill.style.width = progress + '%';
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.reload();
            }
        }, 1000);
        
        // Allow manual refresh
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                clearInterval(timer);
            }
        });
    </script>
</body>
</html>

<section class="sensor-form-section">
  <div class="card">
    <h2>Submit Sensor Reading</h2>
    <form id="sensorForm" class="sensor-form">
      <div class="form-row">
        <div class="form-group">
          <label for="sensorId">Sensor ID:</label>
          <input
            type="text"
            id="sensorId"
            name="sensorId"
            required
            placeholder="e.g., SENSOR_001"
          />
        </div>
        <div class="form-group">
          <label for="humidity">Humidity (%):</label>
          <input
            type="number"
            id="humidity"
            name="humidity"
            min="0"
            max="100"
            step="0.1"
            required
            placeholder="e.g., 65.5"
          />
        </div>
        <div class="form-group">
          <label for="temperature">Temperature (°C):</label>
          <input
            type="number"
            id="temperature"
            name="temperature"
            min="-50"
            max="100"
            step="0.1"
            required
            placeholder="e.g., 23.5"
          />
        </div>
      </div>
      <button type="submit" class="submit-btn">Submit Reading</button>
    </form>
    <div id="submitMessage" class="message"></div>
  </div>
</section>
